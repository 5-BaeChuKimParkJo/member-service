name: Build homelab image

on:
  push:
    branches: [codex/homelab-deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/5-baechukimparkjo/member-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test and package
        run: |
          chmod +x gradlew
          ./gradlew test --tests '*Postgresql*Test' bootJar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" --tag "$IMAGE_NAME:homelab" .
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:homelab"
